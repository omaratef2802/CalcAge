<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Calc</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./age.css" />
  </head>
  <body class="d-flex justify-content-center align-items-center">
    <div class="parent d-flex flex-column flex-lg-row gap-5 p-5">
      <div
        class="left d-flex flex-column gap-5 p-4"
        style="background: linear-gradient(135deg, #2563eb, #1d4ed8)"
      >
        <div class="m-4">
          <h2 class="mb-4">Your Birth Date</h2>
          <div
            class="m-2 mt-5 d-flex flex-column flex-md-row justify-content-evenly gap-4"
          >
            <input
              type="text"
              pattern="^(3[01]|[12][0-9]|[1-9])$"
              disabled
              placeholder="enter day"
              class="d-sm-block"
              style="
                border-radius: 10px;
                border: none;
                height: 50px;
                background-color: #d5d5d5;
              "
            />
            <select
              name="month"
              id="mon"
              class="d-sm-block"
              style="border-radius: 10px; border: none; height: 50px"
            >
              <option value="" selected disabled>selct month</option>
              <option value="1">january</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
            <input
              type="text"
              pattern="[1-9][0-9]{0,3}"
              id="year"
              placeholder="enter years"
              class="d-sm-block"
              style="border-radius: 10px; border: none; height: 50px"
            />
          </div>
        </div>
        <button id="btn-age">Calculate My Age</button>
      </div>
      <div
        class="right text-center d-flex flex-column justify-content-center align-items-center p-5"
      >
        <h1 class="mb-4">Your Age</h1>
        <div class="d-flex flex-column flex-md-row gap-5">
          <div class="result-card">
            <span id="years-result">0</span>
            <p>Years</p>
          </div>
          <div class="result-card">
            <span id="months-result">0</span>
            <p>Months</p>
          </div>
          <div class="result-card">
            <span id="days-result">0</span>
            <p>Days</p>
          </div>
        </div>
      </div>
    </div>

    <script src="./age.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
